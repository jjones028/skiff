name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # The compiler, JUnit and the other jars skiff downloads live here.
      - uses: actions/cache@v4
        with:
          path: ~/.skiff
          key: skiff-${{ runner.os }}-${{ hashFiles('Skiff.lock', 'bootstrap.sh', 'bootstrap.ps1') }}
          restore-keys: skiff-${{ runner.os }}-
      - name: Bootstrap
        if: runner.os != 'Windows'
        run: ./bootstrap.sh
      - name: Bootstrap
        if: runner.os == 'Windows'
        run: ./bootstrap.ps1
        shell: pwsh
      - name: Build (self-hosted)
        run: bin/skf build --fat
        shell: bash
      - name: Test
        run: bin/skf test
        shell: bash
      # The Package workflow turns this jar into installers.
      - name: Upload jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: skiff-jar
          path: target/skiff-*-all.jar
          if-no-files-found: error
