name: Package

# Runs after a successful Build of a pull request into main or of a version tag and turns that build's fat jar into installers.
# A tag also publishes them, plus the fat jar and its sha256 (what `skf self-update` fetches), as a GitHub release.
# Run manually (Actions tab or `gh workflow run Package --ref <branch>`), it builds the fat jar of the chosen ref itself
# and uploads the installers as artifacts, without publishing a release.
# The macOS pkg is signed and notarized when the MACOS_CERTIFICATES_P12, MACOS_CERTIFICATES_PASSWORD, APPLE_ID,
# APPLE_APP_PASSWORD and APPLE_TEAM_ID secrets exist (see README).
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      ((github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].base.ref == 'main') ||
      (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-tags: true
      - id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          version=$(grep -m1 '^version' Skiff.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$HEAD_BRANCH" ] && git show-ref --verify --quiet "refs/tags/$HEAD_BRANCH"; then
            if [ "$HEAD_BRANCH" != "v$version" ]; then
              echo "tag $HEAD_BRANCH does not match Skiff.toml version $version" >&2
              exit 1
            fi
            echo "tag=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          fi
      # Manual runs have no Build run to take the jar from, so build it here.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - if: github.event_name == 'workflow_dispatch'
        run: ./bootstrap.sh && bin/skf build --fat
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skiff-jar
          path: target/skiff-*-all.jar
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: skiff-jar
          path: dist-in
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
      - run: packaging/jpackage.sh msi dist-in/skiff-${{ needs.version.outputs.version }}-all.jar ${{ needs.version.outputs.version }} dist
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.msi

  macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: skiff-jar
          path: dist-in
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
      # Signing and notarizing need repository secrets; without them (forks) the pkg is built unsigned.
      - name: Import signing certificates
        id: signing
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATES_P12" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" -A -t cert -f pkcs12
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity() { security find-identity -v "$keychain" | grep "$1" | head -1 | sed 's/.*"\(.*\)".*/\1/'; }
          echo "app=$(identity 'Developer ID Application')" >> "$GITHUB_OUTPUT"
          echo "installer=$(identity 'Developer ID Installer')" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: packaging/jpackage.sh pkg dist-in/skiff-${{ needs.version.outputs.version }}-all.jar ${{ needs.version.outputs.version }} dist
        env:
          SKF_MAC_APP_IDENTITY: ${{ steps.signing.outputs.app }}
          SKF_MAC_INSTALLER_IDENTITY: ${{ steps.signing.outputs.installer }}
      - name: Notarize
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for f in dist/*.pkg; do
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$f"
          done
      - run: for f in dist/*.pkg; do mv "$f" "${f%.pkg}-${{ matrix.arch }}.pkg"; done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-${{ matrix.arch }}
          path: dist/*.pkg

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: skiff-jar
          path: dist-in
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
      - run: cp dist-in/skiff-${{ needs.version.outputs.version }}-all.jar packaging/flatpak/skiff.jar
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: skiff-${{ needs.version.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/io.github.jjones028.Skiff.yml
          cache-key: flatpak-builder-${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-flatpak
          path: skiff-${{ needs.version.outputs.version }}.flatpak

  release:
    if: needs.version.outputs.tag != ''
    needs: [version, windows, macos, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      # The fat jar and its checksum are what `skf self-update` downloads.
      - uses: actions/download-artifact@v4
        with:
          name: skiff-jar
          path: installers
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ github.token }}
      - run: cd installers && sha256sum skiff-*-all.jar > "$(echo skiff-*-all.jar).sha256"
      - run: gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
